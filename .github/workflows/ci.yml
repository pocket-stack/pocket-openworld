name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Record engine revision
        run: git submodule status --recursive

      - name: Check formatting
        run: cargo fmt --package pocket-openworld -- --check

      - name: Test
        run: cargo test --locked --package pocket-openworld

      - name: Lint
        run: cargo clippy --locked --package pocket-openworld --all-targets -- -D warnings

      - name: Create acceptance directory
        run: mkdir -p artifacts

      - name: Build application
        run: cargo build --locked --package pocket-openworld

      - name: Verify interactions, traversal, rendering and replay
        run: python3 tools/verify_traversal.py --output artifacts

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-openworld-acceptance
          path: artifacts/
          if-no-files-found: error
