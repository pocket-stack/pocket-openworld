name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: Swatinem/rust-cache@v2

      - name: Record engine revision
        run: git submodule status --recursive

      - name: Reject committed build and acceptance output
        run: python3 tools/check_generated.py

      - name: Check formatting
        run: cargo fmt --package pocket-openworld -- --check

      - name: Test
        run: cargo test --locked --package pocket-openworld

      - name: Lint
        run: cargo clippy --locked --package pocket-openworld --all-targets -- -D warnings

      - name: Build acceptance executable
        run: cargo build --locked --package pocket-openworld

      - name: Verify automatic UI generation and rebuilds
        run: python3 tools/verify_build.py

      - name: Verify clickable controls, chemistry and orchard regressions
        run: python3 tools/verify_shelter.py --output artifacts

      - name: Verify UI at 2x display scale
        run: python3 tools/verify_shelter.py --scenario controls-open --scenario controls-firebreak --scenario character-water --scenario shelter-rain --scenario controls-stop --scenario water-receiver-blocked --scenario water-receiver-open --size 1920x1200 --ui-scale 2 --output artifacts/2x

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-openworld-acceptance
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
